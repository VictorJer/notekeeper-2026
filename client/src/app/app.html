<router-outlet></router-outlet>
<button
  type="button"
  (click)="alternarModo()"
  class="fixed bottom-4 right-4 z-50 grid size-12 place-items-center rounded-full border border-slate-300 bg-white/95 text-slate-900 shadow-lg backdrop-blur transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
  [attr.aria-label]="modoEscuro() ? 'Ativar modo claro' : 'Ativar modo escuro'"
  [attr.title]="modoEscuro() ? 'Ativar modo claro' : 'Ativar modo escuro'"
>
  @if (modoEscuro()) {
    <span class="text-xl" aria-hidden="true">☀️</span>
  } @else {
    <span class="text-xl" aria-hidden="true">🌙</span>
  }
</button>
