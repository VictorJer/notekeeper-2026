<main class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12 text-slate-800">
  <section class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-sm sm:p-10" aria-labelledby="auth-title">
    <a routerLink="/" class="mb-8 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 transition hover:text-indigo-600">
      <span aria-hidden="true">←</span> Voltar ao início
    </a>
    <div class="mb-8">
      <div class="mb-5 grid size-12 place-items-center rounded-2xl bg-indigo-600 text-white">
        <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 4.75h6.5L19 9.25v9A1.75 1.75 0 0 1 17.25 20h-9.5A1.75 1.75 0 0 1 6 18.25v-11.75A1.75 1.75 0 0 1 7.75 4.75Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 5v4.5h4.5M9 13h6M9 16.5h6"/></svg>
      </div>
      <p class="mb-2 text-sm font-semibold text-indigo-600">NoteKeeper</p>
      <h1 id="auth-title" class="text-3xl font-bold tracking-tight text-slate-900">{{ titulo }}</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">{{ descricao }}</p>
    </div>
    <!-- Insere aqui o conteúdo fornecido pela tela de login ou de cadastro. -->
    <ng-content />
  </section>
</main>
