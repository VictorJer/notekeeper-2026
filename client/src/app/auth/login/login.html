<!-- Reutiliza o layout de autenticação com os textos próprios da tela de login. -->
<app-pagina-autenticacao titulo="Boas-vindas de volta" descricao="Entre na sua conta para acessar suas notas.">
  <form class="space-y-5" (submit)="$event.preventDefault()">
    <div>
      <label for="email" class="mb-2 block text-sm font-medium text-slate-700">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" />
    </div>
    <div>
      <label for="senha" class="mb-2 block text-sm font-medium text-slate-700">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Sua senha" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" />
    </div>
    <button type="submit" class="w-full rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Entrar</button>
  </form>
  <p class="mt-6 text-center text-sm text-slate-500">Ainda não tem conta? <a routerLink="/cadastro" class="font-semibold text-indigo-600 hover:text-indigo-700">Cadastre-se</a></p>
</app-pagina-autenticacao>
